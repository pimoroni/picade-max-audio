name: CMake

on:
  push:
  pull_request:
  release:
    types: [created]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{matrix.name}}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            cache-key: linux
            cmake-args: '-DPIMORONI_PICO_PATH=$GITHUB_WORKSPACE/pimoroni-pico -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk'

    runs-on: ${{matrix.os}}

    # Required for attaching packages to a release
    permissions:
      contents: write

    env:
      PICO_SDK_PATH: $GITHUB_WORKSPACE/pico-sdk
      PIMORONI_PICO_LIBS: $GITHUB_WORKSPACE/pimoroni-pico
      RELEASE_FILE: ${{github.event.repository.name}}-${{github.event.release.tag_name || github.sha}}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        path: project

    # Checkout the Pimoroni Pico Libraries
    - name: Checkout Pimoroni Pico Libraries
      uses: actions/checkout@v7
      with:
        repository: pimoroni/pimoroni-pico
        path: pimoroni-pico

    # Checkout the Pico SDK
    - name: Checkout Pico SDK
      uses: actions/checkout@v7
      with:
        repository: raspberrypi/pico-sdk
        path: pico-sdk
        ref: 2.3.0
        submodules: true

    # Checkout Pico Extras
    - name: Checkout Pico Extras
      uses: actions/checkout@v7
      with:
        repository: raspberrypi/pico-extras
        path: pico-extras
        ref: sdk-2.3.0
        submodules: true

    - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '12.2.Rel1'

    - name: Bump TinyUSB
      run: |
        cd $GITHUB_WORKSPACE/pico-sdk/lib/tinyusb
        git fetch origin refs/tags/0.21.0:refs/tags/0.21.0
        git checkout refs/tags/0.21.0

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE/project -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCPACK_PACKAGE_FILE_NAME=${{env.RELEASE_FILE}} -DCMAKE_INSTALL_PREFIX=`pwd`/install ${{matrix.cmake-args}}

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        cmake --build . --config $BUILD_TYPE -j 2

    - name: Prepare Artifact
      if: github.event_name != 'release'
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        cmake --build . --config $BUILD_TYPE --target install -j 2

    - name: Upload Artifact
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.RELEASE_FILE}}
        path: ${{runner.workspace}}/build/install

    - name: Build Release Packages
      if: github.event_name == 'release'
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        cmake --build . --config $BUILD_TYPE --target package -j 2

    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{runner.workspace}}/build/${{env.RELEASE_FILE}}.zip
          ${{runner.workspace}}/build/${{env.RELEASE_FILE}}.tar.gz
